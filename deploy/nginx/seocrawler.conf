# SEO Crawler — plantilla de nginx
#
# Pensada para un VPS que YA tiene otros proyectos. No toca la configuración
# global de nginx: es un server block independiente que sólo responde a su
# propio `server_name`.
#
# Sustituye:
#   __DOMAIN__   dominio o subdominio, p. ej. seo.tudominio.com
#   __PORT__     puerto local de la app (usa deploy/check-ports.sh para elegirlo)
#
#   sed -e 's/__DOMAIN__/seo.tudominio.com/g' -e 's/__PORT__/3210/g' \
#       deploy/nginx/seocrawler.conf | sudo tee /etc/nginx/sites-available/seocrawler
#
# Después:
#   sudo ln -s /etc/nginx/sites-available/seocrawler /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d __DOMAIN__
#
# Certbot añade solo el bloque 443 y la redirección. No hace falta escribirlos
# aquí: si los pones a mano antes de tener certificado, nginx no arranca.

# Cabeceras del proxy. Se definen una vez y se reutilizan en las dos rutas.
# Si otro proyecto del servidor ya declara un `map` con este nombre, cambia
# el sufijo _seocrawler por otro.
map $http_upgrade $connection_upgrade_seocrawler {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Descoméntala sólo si el VPS tiene IPv6. Si no lo tiene, nginx no
    # arranca — y al no arrancar se caen TAMBIÉN los demás sitios del
    # servidor. Compruébalo antes con:  ip -6 addr show
    # listen [::]:80;

    # Sin `default_server` a propósito: así no se roba el tráfico de los
    # dominios que ya sirve este nginx. Sólo responde a su server_name.

    server_name __DOMAIN__;

    # Importaciones de keywords por CSV. El valor por defecto de nginx (1 MB)
    # se queda corto con exports grandes de Search Console o Semrush.
    client_max_body_size 32m;

    # Los informes de IA y las mediciones de posiciones pueden tardar hasta
    # 300 s (`maxDuration` en las rutas de API). Con los 60 s por defecto de
    # nginx, la petición se corta a media generación y el usuario ve un 504.
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;

    # Registros separados: en un VPS compartido no conviene mezclarlos con
    # los de otros proyectos.
    access_log /var/log/nginx/seocrawler.access.log;
    error_log  /var/log/nginx/seocrawler.error.log;

    # Cabeceras de seguridad básicas. La app no se embebe en iframes ni
    # necesita que un tercero la incruste.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Estáticos de Next con hash en el nombre: inmutables, se cachean fuerte.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Next lo usa para construir URLs absolutas y para que la cookie de
        # sesión se marque como `secure` detrás de HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_seocrawler;

        # El HMR de desarrollo no existe en producción, pero desactivar el
        # buffer evita que respuestas largas se queden retenidas en nginx.
        proxy_buffering off;
    }
}
